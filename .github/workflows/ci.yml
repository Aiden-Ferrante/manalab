name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'
      - name: Lint (ruff, Pyflakes rules)
        run: .venv/bin/ruff check .
      # No card data is downloaded in CI: the tests that read real Scryfall
      # cards skip themselves when data/cards.duckdb is absent.
      - name: Test
        run: .venv/bin/pytest -q
