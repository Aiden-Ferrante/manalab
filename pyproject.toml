[project]
name = "manalab"
version = "0.1.0"
description = "Deckbuilding search over Magic: the Gathering, with a swappable game model"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
analysis = [
    "numpy>=2.0",
    "polars>=1.0",
]
notebooks = [
    "jupyterlab>=4.0",
    "matplotlib>=3.9",
]

[project.scripts]
manalab = "manalab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
